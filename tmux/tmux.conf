# prefix を C-Space に変更
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# window 番号を 1 から開始
set -g base-index 1
setw -g pane-base-index 1

# Terminal.app スクロール対応
# mouse off + alternate screen 無効化でターミナル本来のスクロールを使用
set -g mouse off
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# window 操作 (prefix + key)
# l: 一覧
bind l choose-tree -w
# n: 新規作成
bind n new-window -c "#{pane_current_path}"
# j: 次
bind j next-window
# k: 前
bind k previous-window
# c: コピーモード
bind c copy-mode
# 1-9: 番号で選択 (デフォルトのまま)
# r: 名前変更
bind r command-prompt -I "#W" "rename-window '%%'"
# e: 終了
bind e confirm-before -p "kill window? (y/n)" kill-window
# u: 戻る
bind u last-window

# pane-table (prefix + p で入る)
bind p switch-client -T pane-table
# j: 左右分割
bind -T pane-table j split-window -h -c "#{pane_current_path}"
# l: 上下分割
bind -T pane-table l split-window -v -c "#{pane_current_path}"
# e: 終了
bind -T pane-table e confirm-before -p "kill pane? (y/n)" kill-pane

# pane 移動 (prefix + 矢印キー) - デフォルト設定を利用

# f: 一時最大化
bind f resize-pane -Z

# copy mode は vi キーバインド
setw -g mode-keys vi
# v: 範囲選択, V: 行選択, C-v: 矩形選択
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ステータスバー
set -g status-style 'bg=colour236 fg=colour248'
set -g status-left '#S: '
set -g status-left-length 20
set -g status-right ''
set -g window-status-format '#W'
set -g window-status-current-format '#[bold,underscore]#W#[nobold,nounderscore]'
